name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run on PR comments that contain the trigger phrase
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      # The action's bundled installer prints "successfully installed" even when
      # it produced no binary, then the run dies on "native binary not found at
      # ~/.local/bin/claude". Since v1.0.100 it always passes that path to the
      # SDK instead of letting the SDK fall back to its own bundled binary
      # (anthropics/claude-code-action#1242; fix PR #1260 still open).
      # Installing it here and asserting the binary exists fails loudly at the
      # step that is actually wrong.
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          test -x "$(command -v claude)"
          echo "CLAUDE_BIN=$(command -v claude)" >> "$GITHUB_ENV"

      # No continue-on-error: this step exists only to tell us something, so
      # letting it fail green makes its silence mean nothing. That is how a
      # broken review sat unnoticed.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request and provide a BRIEF, CONCISE review.

            IMPORTANT FORMATTING RULES:
            - Keep your ENTIRE review under 500 words
            - Use bullet points, not paragraphs
            - ALWAYS include file path and line number for each issue (e.g., "src/components/ui/BalanceCard.tsx:42")
            - Only mention issues if you find them - don't add "looks good" items
            - Group related items together
            - Be direct and to the point

            Review for:
            - Code quality and best practices (TypeScript strict mode, React Native patterns)
            - Potential bugs or issues
            - Security concerns (SecureStore usage, token handling)
            - Theme/dark mode correctness (useTheme(), no hardcoded colors)
            - i18n completeness (all user-facing strings in en.json + es.json)

            Stack context: React Native + Expo SDK 52, Expo Router v4, Zustand v5, React Query v5, TypeScript strict mode. Primary locale: es-MX.

            FORMAT YOUR REVIEW EXACTLY LIKE THIS:

            🔴 Critical Issues:
            - file.tsx:42 - Issue description

            🟡 Minor Issues:
            - file.tsx:15 - Issue description

            🔵 Suggestions:
            - file.tsx:8 - Suggestion description

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
