# Same as Rails E2E: comment-triggered workflows are read from the default branch YAML.
name: Mobile E2E

on:
  issue_comment:
    types: [created]

jobs:
  e2e:
    # GitHub Expressions have no lowercase(); keep trigger phrase exact (also matches as substring).
    if: github.event.issue.pull_request && contains(github.event.comment.body || '', 'run-e2e')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write

    env:
      EXPO_PUBLIC_API_URL: http://localhost:3001/api/v1

    steps:
      - name: Create PR check run
        id: create_check
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber
            });
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Mobile E2E (run-e2e)",
              head_sha: pr.head.sha,
              status: "in_progress",
              details_url: runUrl,
              output: {
                title: "Mobile E2E started",
                summary: "Triggered by PR comment `run-e2e`."
              }
            });
            core.setOutput("check_run_id", String(check.id));
            core.setOutput("head_sha", pr.head.sha);

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web output
        run: npm run e2e:build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E
        id: playwright
        continue-on-error: true
        run: npm run e2e

      - name: Upload Playwright report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Playwright screenshots and videos
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Comment E2E results on PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.upload_evidence.outputs.artifact-url }}
          RESULTS_JSON: e2e/playwright-report/results.json
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- mobile-e2e-comment -->";
            const issueNumber = context.payload.issue.number;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const status = process.env.PLAYWRIGHT_OUTCOME === "success" ? "passed" : "failed";
            const icon = process.env.PLAYWRIGHT_OUTCOME === "success" ? "✅" : "❌";
            const resolveArtifactUrl = async (artifactName, providedUrl) => {
              if (providedUrl) return providedUrl;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.GITHUB_RUN_ID),
                per_page: 100
              });
              const artifact = (data.artifacts || []).find((item) => item.name === artifactName && !item.expired);
              return artifact ? artifact.archive_download_url : runUrl;
            };
            const reportLink = await resolveArtifactUrl("mobile-e2e-playwright-report", process.env.REPORT_ARTIFACT_URL);
            const evidenceLink = await resolveArtifactUrl("mobile-e2e-test-results", process.env.EVIDENCE_ARTIFACT_URL);
            const failedTests = [];

            if (fs.existsSync(process.env.RESULTS_JSON || "")) {
              const report = JSON.parse(fs.readFileSync(process.env.RESULTS_JSON, "utf8"));
              const collectFailedTests = (suite, titlePath = []) => {
                const suiteTitlePath = suite.title ? [...titlePath, suite.title] : titlePath;
                for (const spec of suite.specs || []) {
                  const hasFailure = (spec.tests || []).some((test) =>
                    (test.results || []).some((result) =>
                      ["failed", "timedOut", "interrupted"].includes(result.status)
                    )
                  );
                  if (hasFailure) {
                    failedTests.push([...suiteTitlePath, spec.title].filter(Boolean).join(" › "));
                  }
                }
                for (const childSuite of suite.suites || []) {
                  collectFailedTests(childSuite, suiteTitlePath);
                }
              };
              collectFailedTests(report);
            }
            const failedSummary =
              failedTests.length > 0
                ? `\n### Failed tests\n${failedTests.slice(0, 10).map((name) => `- \`${name}\``).join("\n")}${
                    failedTests.length > 10 ? `\n- ...and ${failedTests.length - 10} more` : ""
                  }\n`
                : "";
            const body = `${marker}
            ## ${icon} Mobile Playwright E2E ${status}

            - Workflow run: [Open run logs](${runUrl})
            - HTML report artifact: [Download report](${reportLink})
            - Screenshots/videos artifact: [Download test results](${evidenceLink})
            ${failedSummary}

            Triggered by comment: \`run-e2e\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
            }

      - name: Update PR check run
        if: always()
        uses: actions/github-script@v7
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
          CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
        with:
          script: |
            if (!process.env.CHECK_RUN_ID) {
              core.warning("No check run id found; skipping check update.");
              return;
            }
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const succeeded = process.env.PLAYWRIGHT_OUTCOME === "success";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: "completed",
              conclusion: succeeded ? "success" : "failure",
              completed_at: new Date().toISOString(),
              details_url: runUrl,
              output: {
                title: succeeded ? "Mobile E2E passed" : "Mobile E2E failed",
                summary: succeeded
                  ? "Playwright E2E completed successfully."
                  : "Playwright E2E failed. Check workflow logs and artifacts."
              }
            });

      - name: Fail workflow when Playwright fails
        if: steps.playwright.outcome != 'success'
        run: exit 1
